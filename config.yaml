# ============================================================
#  HABER RADARI — ayarlar
#  Yeni kaynak eklemek için "sources" listesine bir satır ekleyin.
#  Yeni anahtar kelime için ilgili listeye ekleyin.
#  (Büyük/küçük harf ve aksan fark etmez.)
# ============================================================

title: "DRC Güvenlik Radarı"

# Kaç günlük haber saklansın / en fazla kaç haber listelensin
keep_days: 14
max_items: 400

# Telegram bildirimi: "all" = her yeni haber, "high" = sadece yüksek öncelikli, "off" = kapalı
notify: high

# Türkçe çeviri (ücretsiz Google Çeviri): true = açık, false = kapalı
translate: true
# Bir taramada en fazla kaç haber çevrilsin (kalanlar sonraki taramada çevrilir)
translate_limit: 80

sources:
  # --- Doğrudan RSS yayınlayan siteler ---
  - name: BBC
    url: https://feeds.bbci.co.uk/news/world/africa/rss.xml
  - name: Al Jazeera
    url: https://www.aljazeera.com/xml/rss/all.xml
  - name: France 24
    url: https://www.france24.com/en/africa/rss
  - name: France 24 (FR)
    url: https://www.france24.com/fr/afrique/rss
  - name: RFI (FR)
    url: https://www.rfi.fr/fr/afrique/rss

  # --- Reuters ve AP herkese açık RSS vermiyor; Google News üzerinden site bazlı arama ---
  - name: Reuters
    url: https://news.google.com/rss/search?q=(Congo+OR+DRC+OR+M23+OR+Kivu)+site:reuters.com+when:7d&hl=en-US&gl=US&ceid=US:en
  - name: AP
    url: https://news.google.com/rss/search?q=(Congo+OR+DRC+OR+M23+OR+Kivu)+site:apnews.com+when:7d&hl=en-US&gl=US&ceid=US:en

  # Örnek: yeni kaynak eklemek
  # - name: The Guardian
  #   url: https://www.theguardian.com/world/drc/rss

